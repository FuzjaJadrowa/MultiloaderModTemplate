# gradle.properties
# Root gradle configuration for the Multi-Version template.
# This file contains the global metadata for your mod.

# Gradle Settings
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=false

# Mod Details (Modify these for your mod!)
mod.id=examplemod
mod.name=Example Mod
mod.version=1.0.0
mod.group=com.example.examplemod

# Publishing Details (Specify your repository and project IDs here or in your CI environment)
publish.github.repository=ExampleUser/ExampleMod
publish.modrinth.project_id=EXAMPLE_MODRINTH_ID
publish.curseforge.project_id=EXAMPLE_CURSEFORGE_ID

# [VERSIONED] Placeholder Properties
# These properties are defined dynamically per Minecraft version target.
# Do NOT modify them here; instead, modify the corresponding target property files inside:
# C:\Users\Tomek\IdeaProjects\MultiloaderModTemplate\gradle\targets\
mod.mc_title=[VERSIONED]
mod.mc_targets=[VERSIONED]
mod.java_version=[VERSIONED]

# Dependency Placeholders
dep.minecraft.fabric=[VERSIONED]
dep.minecraft.neoforge=[VERSIONED]
dep.fabric_loader=[VERSIONED]
dep.neoforge_loader=[VERSIONED]
dep.neoforge_loader_range=[VERSIONED]
dep.neoforge_version_range=[VERSIONED]
dep.fabric_api_version=[VERSIONED]
