# Gradle Configuration Options
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.caching.debug=false

# ==========================================
# MOD METADATA CONFIGURATION
# ==========================================
# The unique identifier of the mod. Used in folder structures, mixin filenames, and registration.
# Must be all lowercase, alphanumeric, and may contain underscores (no spaces).
mod.id=examplemod

# The user-friendly name of the mod displayed in-game or on mod loaders.
mod.name=Example Mod

# The version of your mod (semantic versioning recommended: major.minor.patch).
mod.version=1.0.0

# The base Java package prefix for your mod code (typically reverse domain name).
mod.group=com.example

# ==========================================
# TARGET MINECRAFT & JAVA VERSIONS
# ==========================================
# Human-readable title of the main target Minecraft version (e.g. 1.21.1).
mod.mc_title=1.21.1

# Version range specification matching target platforms (used in fabric.mod.json and neoforge.mods.toml).
# Examples: ">=1.21 <1.21.2" (range) or "1.21.1" (exact match)
mod.mc_targets=>=1.21 <1.21.2

# The Java language compatibility version required by Minecraft and the loaders (21 is standard for 1.20.5+).
mod.java_version=21

# ==========================================
# DEPENDENCY VERSIONS
# ==========================================
# Minecraft dependency versions used for workspace compilation.
dep.minecraft.fabric=1.21.1
dep.minecraft.neoforge=1.21.1

# Fabric Loader and API dependency versions.
# Find versions here: https://fabricmc.net/develop/
dep.fabric_loader=0.15.11
dep.fabric_api_version=0.102.0+1.21.1
dep.modmenu_version=11.0.1

# NeoForge Loader and SDK versions.
# Find versions here: https://neoforged.net/
dep.neoforge_loader=21.1.227
dep.neoforge_loader_range=[4,)
dep.neoforge_version_range=[21.1,)

# ==========================================
# PUBLISHING & RELEASES CONFIGURATION
# ==========================================
# Repository path on GitHub (Format: Owner/RepoName). Used for releases.
publish.github.repository=YourUsername/ExampleMod

# Modrinth Project ID/Slug where the built jars should be uploaded.
publish.modrinth.project_id=examplemod

# CurseForge Project ID where the built jars should be uploaded.
publish.curseforge.project_id=examplemod